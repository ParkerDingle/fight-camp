# The league, running by itself.
#
# Everything this repo needs is in it: the scraper, the database, the page
# template. GitHub runs the scraper on a schedule, rebuilds index.html and
# commits the result — which is also the deploy, because Pages serves this
# branch. No laptop has to be awake on a Sunday morning.
#
# The database is committed with every run. It is a few hundred KB and it is
# the system of record: without it in the repo each run would start from an
# empty database and re-scrape a year of cards.
name: League

on:
  schedule:
    # Cards finish late Saturday US time. Catch the results twice on Sunday,
    # then once a day as the safety net for amended results and late cards.
    - cron: "0 8 * * 0"
    - cron: "0 14 * * 0"
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "which pipeline command to run"
        type: choice
        default: nightly
        options: [nightly, post-event, roster, export, verify]

# The job commits back to this branch, so it needs write access. Nothing else.
permissions:
  contents: write

# Two runs writing the database at once would have one of them lose its work to
# the other's push. Queue them instead.
concurrency:
  group: league
  cancel-in-progress: false

env:
  DRAFT_DATE: "2026-09-05"
  MANAGERS: "Parker,Cian,Daniel,Chris,Jackson,Hugh,Mark"
  SEASON_START: "2025-09-01"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      # There was a headless browser here, installed on every run so the scraper
      # could try to talk its way past the holding page ufcstats serves a shared
      # runner. It did not work, and it was worse than not working: driving a
      # browser through the backoff made the scrape step run for longer than the
      # whole job was allowed, so the job was killed before it ever reached the
      # rebuild. The site therefore stopped publishing entirely — not because
      # the scrape failed, which was survivable and expected, but because the
      # failing scrape was allowed to consume every minute the job had.
      #
      # Two changes fix that, and the second is the one that matters:
      #   - no browser, so the scrape fails in seconds instead of grinding, and
      #     every run is two minutes shorter into the bargain;
      #   - a hard timeout on the scrape step, so it can never again take the
      #     rebuild and the publish down with it.

      # Pages already fetched are not fetched again. This is politeness to
      # ufcstats as much as speed: a nightly run that re-reads the whole index
      # every time is how you get blocked.
      - name: Restore the fetch cache
        uses: actions/cache@v4
        with:
          path: pipeline/data/cache
          key: ufc-cache-${{ github.run_id }}
          restore-keys: ufc-cache-

      # ufcstats rate-limits datacenter addresses, and some days it simply will
      # not talk to a GitHub runner. That must not stop the league publishing:
      # the roster, the rankings and the rebuild below need nothing from it, and
      # a card scraped a day late is far better than a site that stops updating
      # and mails everyone about it. The outcome is reported in the summary.
      - name: Scrape
        id: scrape
        continue-on-error: true
        # The budget, not an expectation. A scrape that gets through takes two
        # or three minutes; one that is being refused spends its time in backoff
        # and is worth nothing however long it is given. Everything below this
        # step is what actually publishes the league, and it now always runs.
        timeout-minutes: 12
        working-directory: pipeline
        env:
          UFC_FORCE_BROWSER: "0"
          UFC_SCRAPER_CONTACT: ${{ secrets.UFC_SCRAPER_CONTACT || format('{0}@users.noreply.github.com', github.repository_owner) }}
          # A shared runner is a datacenter address, which sites treat with more
          # suspicion than a home connection. Ask for pages more slowly than the
          # default rather than finding out the hard way.
          UFC_MIN_INTERVAL: "3.0"
          UFC_NTFY_TOPIC: ${{ secrets.UFC_NTFY_TOPIC }}
          UFC_DISCORD_WEBHOOK: ${{ secrets.UFC_DISCORD_WEBHOOK }}
          UFC_TELEGRAM_TOKEN: ${{ secrets.UFC_TELEGRAM_TOKEN }}
          UFC_TELEGRAM_CHAT: ${{ secrets.UFC_TELEGRAM_CHAT }}
        run: |
          python pipeline.py "${{ inputs.job || 'nightly' }}" \
            --since "$SEASON_START" --fighter-limit 40

      # Who is under contract. One Wikipedia request, and it is what makes a
      # newly signed fighter draftable and a released one unpickable.
      - name: Refresh the roster
        if: ${{ inputs.job != 'verify' }}
        working-directory: pipeline
        continue-on-error: true
        env:
          UFC_SCRAPER_CONTACT: ${{ secrets.UFC_SCRAPER_CONTACT || format('{0}@users.noreply.github.com', github.repository_owner) }}
        run: python pipeline.py roster --since "$SEASON_START"

      - name: Rebuild the page
        if: ${{ inputs.job != 'verify' }}
        working-directory: pipeline
        run: |
          python pipeline.py export --since "$SEASON_START"
          python build_app.py --draft-date "$DRAFT_DATE" --managers "$MANAGERS"
          python build_site.py --out ../_site

      # SQLite keeps recent writes in a side file until the last connection
      # closes. Fold them in, or the committed database is missing this run.
      - name: Settle the database
        run: |
          python - <<'PY'
          import sqlite3
          con = sqlite3.connect("pipeline/data/ufc.db")
          con.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          con.close()
          PY

      # Publishing is the one step that can collide with a person.
      #
      # schedule/go-serverless.ps1 pushes the same three things this job writes
      # — the page, the service worker and the database — and it exists exactly
      # so somebody can scrape from home on a day the runner is refused. So the
      # two *will* land on top of each other, and on 9 Sep they did: this step
      # committed, then `git pull --rebase` stopped dead on
      #
      #     CONFLICT (content): Merge conflict in pipeline/data/ufc.db
      #
      # which is git saying the only true thing it can about a SQLite file two
      # machines rewrote independently. The run failed, the page went unpublished
      # and everyone got an email about a pipeline that was working fine.
      #
      # Rebase was the wrong model. Nothing here is a change to be replayed: the
      # site is a pure function of (database + template), and the database is
      # two sets of rows that both belong. So when the branch has moved: take
      # their tree, fold this run's rows into it with `pipeline.py merge-db`
      # (which knows a completed card beats an announced one, and that a
      # fighter-page refresh must not undo a roster pass), rebuild, and push a
      # fast-forward. There is nothing left for git to reconcile.
      - name: Publish
        if: ${{ inputs.job != 'verify' }}
        run: |
          git config user.name  "fight-camp bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          base="$(git rev-parse HEAD)"

          for attempt in 1 2 3; do
            cp -a _site/. .
            rm -rf _site
            git add -A
            if git diff --cached --quiet; then
              echo "nothing changed"
              exit 0
            fi
            git commit -q -m "League update: ${{ inputs.job || 'nightly' }} $(date -u +%Y-%m-%d)"
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then
              echo "published"
              exit 0
            fi

            git fetch -q origin "$GITHUB_REF_NAME"
            remote="$(git rev-parse "origin/$GITHUB_REF_NAME")"
            if [ "$remote" = "$base" ]; then
              echo "::error title=Push refused::The branch has not moved, so this was not a race. Check Settings -> Actions -> General -> Workflow permissions."
              exit 1
            fi

            echo "beaten to the branch by $(git rev-parse --short "$remote"); folding this run into it (attempt $attempt)"
            cp pipeline/data/ufc.db "$RUNNER_TEMP/ours.db"
            git reset --hard -q "$remote"
            base="$remote"
            cd pipeline
            python pipeline.py merge-db "$RUNNER_TEMP/ours.db"
            python pipeline.py export --since "$SEASON_START"
            python build_app.py --draft-date "$DRAFT_DATE" --managers "$MANAGERS"
            python build_site.py --out ../_site
            # The rebuild reopened the database, so fold its write-ahead log in
            # again before this loop commits the file.
            python -c "import sqlite3;c=sqlite3.connect('data/ufc.db');c.execute('PRAGMA wal_checkpoint(TRUNCATE)');c.close()"
            cd ..
          done

          echo "::error title=Could not publish::Three pushes in a row were beaten to the branch."
          exit 1

      - name: Say whether the scrape got through
        if: always()
        run: |
          if [ "${{ steps.scrape.outcome }}" = "success" ]; then
            echo "**Scrape:** ok" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=ufcstats unavailable::The results scrape was refused; the page was still rebuilt and published from what is already in the database."
            echo "**Scrape:** refused by ufcstats — published from existing data" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: What is in the database now
        if: always()
        working-directory: pipeline
        run: |
          {
            echo '```'
            python pipeline.py status || echo "status unavailable"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The last thing, and deliberately the only step allowed to fail the run.
      #
      # A refused scrape is not a failure — it happens most days and the league
      # publishes anyway. Results that have stopped arriving altogether *are* a
      # failure, and the first time that happened nothing said so: every screen
      # kept working and the standings quietly stopped moving for a fortnight.
      #
      # A failed workflow is an email from GitHub to the repo owner with no
      # configuration at all, which makes this the one alert certain to arrive.
      - name: Is the league still being fed?
        if: ${{ inputs.job != 'verify' }}
        working-directory: pipeline
        env:
          UFC_NTFY_TOPIC: ${{ secrets.UFC_NTFY_TOPIC }}
          UFC_DISCORD_WEBHOOK: ${{ secrets.UFC_DISCORD_WEBHOOK }}
          UFC_TELEGRAM_TOKEN: ${{ secrets.UFC_TELEGRAM_TOKEN }}
          UFC_TELEGRAM_CHAT: ${{ secrets.UFC_TELEGRAM_CHAT }}
          UFC_LEAGUE_URL: "https://parkerdingle.github.io/fight-camp/"
        run: |
          if python pipeline.py health >> "$GITHUB_STEP_SUMMARY" 2>&1; then
            echo "league is being fed"
          else
            echo "::error title=Results have stopped arriving::Run schedule/catch-up.ps1 on the PC — a home connection is not refused the way a datacenter is."
            exit 1
          fi
