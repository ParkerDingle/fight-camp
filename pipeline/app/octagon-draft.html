    +'<div class="stack">'+S.managers.map(function(m){
      return '<button class="pick-item" data-act="claim" data-m="'+m.id+'" aria-pressed="'+(m.id===ME)+'">'
        +'<span class="fi"><b>'+esc(m.name)+'</b><span>'+managerTotal(m.id).pts.toFixed(1)+' pts</span></span>'
        +'<span class="chip">'+(m.id===ME?"you":"switch")+'</span></button>';
    }).join("")+'</div><button class="btn ghost" data-act="close-sheet">Close</button>');
}

/* ============================ actions ============================ */
function logIt(text){ S.log.unshift({ts:Date.now(),text:text}); S.log=S.log.slice(0,30); }
function addFighter(mid,fid,ts){ (S.rosters[mid]=S.rosters[mid]||[]).push({f:fid,since:ts||Date.now()}); }
function dropFighter(mid,fid){
  var r=S.rosters[mid]||[], keep=[];
  r.forEach(function(e){
    if(e.f===fid) S.banked[mid]=round1((S.banked[mid]||0)+fighterPoints(fid,e.since));
    else keep.push(e);
  });
  S.rosters[mid]=keep;
}
function makePick(mid,fid){
  var n=S.picks.length;
  S.picks.push({r:Math.floor(n/S.managers.length)+1,ov:n+1,m:mid,f:fid,ts:Date.now()});
  addFighter(mid,fid,Date.now());
  if(S.picks.length>=draftOrder().length && S.league.draftMode==="live"){
    S.league.draftMode="complete";
    logIt("Draft complete");
  }
}
/* Called wherever the page could have been sitting idle across a deadline: on
   load, whenever a newer state arrives, and on the timer. */
var tickBusy=false;
function tickDraft(){
  if(tickBusy) return false;
  tickBusy=true;
  var changed=false;
  try{ changed=runAutoPicks(); }catch(e){}
  tickBusy=false;
  if(changed) commit();
  return changed;
}
/* Auto-pick has to land on the same fighter on every phone that works out the
   clock has expired, or two managers watching at once would draft two different
   people into one slot. So no randomness: rank and how often the fighter
   actually competes, with the id as a last tiebreak. Activity is weighted
   because a roster spot is worth what it fights, which is the whole premise of
   the league — an auto-pick should not hand someone a champion who turns up
   once a year. */
function activityOf(fid){
  var n=0, cut=NOW-540*864e5;
  (BOUT_BY_FIGHTER[fid]||[]).forEach(function(x){ if(x.e.ts>=cut) n++; });
  return n;
}
function autoPickValue(f){
  var rank=(f.rank==null||f.rank>=99)?26:f.rank;
  return (100-rank*2.6)+activityOf(f.id)*9;
}
function bestAvailable(){
  var fa=freeAgents(); if(!fa.length) return null;
  return fa.sort(function(a,b){
    return autoPickValue(b)-autoPickValue(a) || a.id.localeCompare(b.id);
  })[0];
}
/* ---- the pick clock ----
   The countdown was only ever text: it ran down and then sat at "expired" for
   ever, and the draft stopped until somebody noticed and pushed it along by
   hand. In a seven-person async draft over ten rounds somebody sleeps through
   their pick — that is what the clock is for. Now any open page that sees an
   expired clock makes the pick, and because the choice and the timestamps are
   derived rather than invented, every page that does it independently produces
   byte-identical state. Firebase's rev guard settles the rest. */
function pickDeadline(n){
  var prev = n ? S.picks[n-1].ts : (S.league.startedTs || S.league.draftTs);
  return prev + S.league.pickHours*36e5;
}
function runAutoPicks(){
  if(S.league.draftMode!=="live") return false;
  var seq=draftOrder(), made=0;
  /* Bounded: a draft that has been left alone for a fortnight catches up in one
     pass, but a clock skew can never spin this. */
  while(S.picks.length<seq.length && made<seq.length){
    var n=S.picks.length, due=pickDeadline(n);
    if(due>Date.now()) break;
    var who=seq[n], best=bestAvailable();
    if(!best) break;
    /* Stamped at the deadline it missed, not at the moment it was noticed, so a
       backlog cascades to exactly the same times whoever opens the page. */
    S.picks.push({r:Math.floor(n/S.managers.length)+1, ov:n+1,
                  m:who, f:best.id, ts:due, auto:true});
    addFighter(who,best.id,due);
    logIt(mgr(who).name+" ran out of clock — auto-picked "+best.name);
    made++;
  }
  if(!made) return false;
  if(S.picks.length>=seq.length && S.league.draftMode==="live"){
    S.league.draftMode="complete";
    logIt("Draft complete");
  }
  return true;
}
document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-act],[data-tab],[data-sub]"); if(!el) return;
  var act=el.dataset.act;
  if(el.dataset.tab){ TAB=el.dataset.tab; render(); return; }
  /* "tab:value" targets one tab's segmented control; a bare value is the
     players tab, which is where these started. */
  if(el.dataset.sub){
    var parts=el.dataset.sub.split(":");
    if(parts.length===2) SUB[parts[0]]=parts[1]; else SUB.players=parts[0];
    render(); return;
  }
  if(act==="event"){ eventSheet(el.dataset.e); return; }
  if(act==="close-sheet"){ if(ev.target===el) closeSheet(); return; }
  if(act==="claim"){
    var m=mgr(el.dataset.m);
    if(authUser){
      var typed=((document.getElementById("jn-code")||{}).value||joinCode||"").trim();
      joinCode=typed;
      if(typed.toUpperCase().replace(/\s+/g,"")!==String(S.league.code||"").toUpperCase()){
        joinError="That is not the league code. Ask in the group chat.";
        render(); return;
      }
      joinError="";
      if(m.uid && m.uid!==authUser.uid){ toast(m.name+" is already taken"); return; }
      var mine=seatOf(authUser.uid);
      if(mine && mine!==m.id){ toast("You already hold "+mgr(mine).name+"'s seat"); return; }
      m.uid=authUser.uid; m.email=authUser.email||"";
    }
    m.claimed=true; ME=m.id;
    try{localStorage.setItem(LOCAL_KEY+"-me",ME);}catch(e){}
    closeSheet(); commit("You're in as "+m.name); return;
  }
  if(act==="auth-in"){ doAuth("in"); return; }
  if(act==="auth-up"){ doAuth("up"); return; }
  if(act==="auth-google"){ doAuth("google"); return; }
  if(act==="auth-toggle"){ authTab = authTab==="up"?"in":"up"; authError=""; render(); return; }
  if(act==="sign-out"){ signOut(); return; }
  if(act==="switch-seat"){ seatSheet(); return; }
  if(act==="fighter"){ fighterSheet(el.dataset.f); return; }
  if(act==="open-pick"){ pickSheet(); return; }
  if(act==="do-pick"){
    closeSheet(); var f=BY_ID[el.dataset.f]; makePick(ME,f.id);
    logIt(mgr(ME).name+" drafted "+f.name); commit("Drafted "+f.name); return;
  }
  if(act==="sim-pick"){
    var seq=draftOrder(), who=seq[S.picks.length], best=bestAvailable();
    if(!best) return; makePick(who,best.id);
    logIt(mgr(who).name+" auto-picked "+best.name);
    commit(mgr(who).name+" took "+best.name); return;
  }
  if(act==="start-draft"){
    if(!commishOnly()) return;
    S.league.draftMode="live";
    S.league.draftTs=Date.now();
    S.league.startedTs=Date.now();
    logIt(mgr(ME).name+" started the draft");
    commit("Draft is open — "+mgr(draftOrder()[S.picks.length]).name+" is on the clock");
    return;
  }
  if(act==="shuffle-order"){
    if(!commishOnly()) return;
    if(S.league.draftMode!=="pre"){ toast("The order is fixed once the draft is open"); return; }
    for(var si=S.managers.length-1;si>0;si--){
      var sj=Math.floor(Math.random()*(si+1)), tmp=S.managers[si];
      S.managers[si]=S.managers[sj]; S.managers[sj]=tmp;
    }
    logIt(mgr(ME).name+" shuffled the draft order");
    commit(mgr(S.managers[0].id).name+" picks first"); return;
  }
  if(act==="foul"){
    if(!commishOnly()) return;
    if(!setFoul(el.dataset.b, el.dataset.fi, el.dataset.k, parseInt(el.dataset.d,10))) return;
    var fn=(BY_ID[el.dataset.fi]||{}).name||"fighter";
    logIt(mgr(ME).name+" updated fouls for "+fn);
    commit("Fouls updated — "+fn);
    /* commit() re-renders the page behind the sheet; redraw the sheet too so the
       counter and the running total move under the finger that tapped them. */
    if(sheetFighter){ closeSheet(); fighterSheet(sheetFighter); }
    return;
  }
  if(act==="restart-draft"){
    if(!commishOnly()) return;
    S.picks=[]; S.rosters={}; S.banked={}; S.trades=[]; S.seed=false;
    S.league.draftMode="pre"; delete S.league.startedTs;
    logIt(mgr(ME).name+" reopened the draft");
    commit("Draft reset — nobody is on the clock"); return;
  }
  if(act==="add"){
    var fid=el.dataset.f;
    if(!signingOpen()){ toast(signingClosedWhy()); return; }
    var lk=lockedUntilAfterCard(fid);
    if(lk){ toast(BY_ID[fid].name+" fights "+ago(lk.ts)+" — locked until the card is over"); return; }
    if(ownerOf(fid)){ toast("Already on a roster"); return; }
    if(released(BY_ID[fid])){ toast("Not on the UFC roster any more"); return; }
    if((S.rosters[ME]||[]).length>=S.league.rosterSize){ dropSheet(fid); return; }
    addFighter(ME,fid); logIt(mgr(ME).name+" signed "+BY_ID[fid].name);
    commit("Signed "+BY_ID[fid].name); return;
  }
  if(act==="drop-for"){
    closeSheet(); dropFighter(ME,el.dataset.f); addFighter(ME,el.dataset.add);
    logIt(mgr(ME).name+" dropped "+BY_ID[el.dataset.f].name+" for "+BY_ID[el.dataset.add].name);
    commit("Roster updated"); return;
  }
  if(act==="drop"){
    closeSheet(); dropFighter(ME,el.dataset.f);
    logIt(mgr(ME).name+" dropped "+BY_ID[el.dataset.f].name);
    commit("Dropped "+BY_ID[el.dataset.f].name); return;
  }
  if(act==="poster"){ posterSheet(); return; }
  if(act==="poster-save"){ savePoster(); return; }
  if(act==="open-trade"){ tradeDraft={to:null,give:[],get:[]}; tradeSheet(); return; }
  if(act==="t-sel"){
    var k=el.dataset.k, id=el.dataset.f, i=tradeDraft[k].indexOf(id);
    if(i>=0) tradeDraft[k].splice(i,1); else tradeDraft[k].push(id);
    closeSheet(); tradeSheet(); return;
  }
  if(act==="t-send"){
    if(!signingOpen()){ toast(signingClosedWhy()); return; }
    var offer={id:"t"+Date.now()+"-"+ME,from:ME,to:tradeDraft.to,
      give:tradeDraft.give.slice(),get:tradeDraft.get.slice(),status:"open",ts:Date.now()};
    var why=tradeProblem(offer);
    if(why){ toast(why); return; }
    S.trades.push(offer);
    logIt(mgr(ME).name+" offered a trade to "+mgr(tradeDraft.to).name);
    closeSheet(); commit("Proposal sent"); return;
  }
  if(act==="trade-yes"){
    var tr=S.trades.filter(function(t){return t.id===el.dataset.t;})[0]; if(!tr) return;
    if(tr.to!==ME){ toast("That offer is not yours to accept"); return; }
    if(tr.status!=="open"){ toast("That offer is no longer open"); return; }
    /* An offer is a promise about a roster that may have moved on since: the
       fighter could have been traded elsewhere, dropped, or offered twice over.
       Re-check it against the roster as it stands, not as it stood. */
    var bad=tradeProblem(tr);
    if(bad){ tr.status="void"; logIt("Trade voided: "+bad); commit(bad); return; }
    /* Banked on the way out, exactly as a drop is. Trading a fighter away used
       to delete every point they had scored for you, which quietly made a fair
       trade a punishment. What a fighter earned while you held them is yours. */
    tr.give.forEach(function(f){ dropFighter(tr.from,f); });
    tr.get.forEach(function(f){ dropFighter(tr.to,f); });
    tr.give.forEach(function(f){ addFighter(tr.to,f,Date.now()); });
    tr.get.forEach(function(f){ addFighter(tr.from,f,Date.now()); });
    tr.status="done"; tr.doneTs=Date.now();
    /* Any other open offer that leaned on a fighter who just moved is dead. */
    S.trades.forEach(function(o){
      if(o.status==="open" && tradeProblem(o)) o.status="void";
    });
    logIt("Trade: "+mgr(tr.from).name+" ↔ "+mgr(tr.to).name);
    commit("Trade complete"); return;
  }
  if(act==="trade-no"){
    var t2=S.trades.filter(function(t){return t.id===el.dataset.t;})[0];
    if(!t2 || t2.status!=="open") return;
    if(t2.to!==ME && t2.from!==ME){ toast("That offer is not yours"); return; }
    var withdrawn = t2.from===ME;
    t2.status = withdrawn ? "withdrawn" : "declined";
    logIt(mgr(ME).name+(withdrawn?" withdrew an offer to ":" declined an offer from ")
      +mgr(withdrawn?t2.to:t2.from).name);
    commit(withdrawn?"Offer withdrawn":"Trade declined"); return;
  }
  if(act==="stats-toggle"){ if(!commishOnly()) return;
    S.scoring.statsOn=!S.scoring.statsOn; commit(
    S.scoring.statsOn?"Stat scoring on — season rescored":"Stat scoring off"); return; }
});
function removeQuiet(mid,fid){
  S.rosters[mid]=(S.rosters[mid]||[]).filter(function(e){return e.f!==fid;});
}
function holds(mid,fid){
  return (S.rosters[mid]||[]).some(function(e){return e.f===fid;});
}
/* Returns why a trade can no longer happen, or null if it still can. Checked
   when the offer is made and again the moment it is accepted, because the gap
   between the two can be days. */
function tradeProblem(tr){
  if(!mgr(tr.from) || !mgr(tr.to)) return "A manager in that trade is gone";
  if(!tr.give.length || !tr.get.length) return "A trade needs fighters on both sides";
  var bad=null;
  tr.give.forEach(function(f){
    if(!holds(tr.from,f)) bad=bad||((BY_ID[f]||{name:"A fighter"}).name+" is no longer on "+mgr(tr.from).name+"'s roster");
  });
  tr.get.forEach(function(f){
    if(!holds(tr.to,f)) bad=bad||((BY_ID[f]||{name:"A fighter"}).name+" is no longer on "+mgr(tr.to).name+"'s roster");
  });
  if(bad) return bad;
  /* Rosters have a fixed size, so an uneven trade would leave one manager short
     and the other over the limit with no way back. */
  if(tr.give.length!==tr.get.length)
    return "Trades have to be even — "+tr.give.length+" for "+tr.get.length+" would break both rosters";
  return null;
}
document.addEventListener("input",function(ev){
  var t=ev.target;
  if(t.id==="au-email"){ authEmail=t.value; return; }
  if(t.id==="jn-code"){ joinCode=t.value; return; }
  if(t.id==="fa-q"){ faFilter.q=t.value; var p=t.selectionStart; render();
    var n=document.getElementById("fa-q"); if(n){n.focus();n.setSelectionRange(p,p);} return; }
  if(t.id==="pk-q"){ pickFilter.q=t.value; var p2=t.selectionStart; closeSheet(); pickSheet();
    var n2=document.getElementById("pk-q"); if(n2){n2.focus();n2.setSelectionRange(p2,p2);} return; }
});
document.addEventListener("change",function(ev){
  var t=ev.target;
  if(t.id==="fa-div"){ faFilter.div=t.value; render(); return; }
  if(t.id==="pk-div"){ pickFilter.div=t.value; closeSheet(); pickSheet(); return; }
  if(t.id==="t-to"){ tradeDraft.to=t.value; tradeDraft.get=[]; closeSheet(); tradeSheet(); return; }
  if(t.dataset.set){ if(!commishOnly()) return;
    var v=parseFloat(t.value); if(isNaN(v))return;
    S.scoring[t.dataset.set]=v; commit("Scoring updated"); return; }
  if(t.dataset.lg){ if(!commishOnly()) return;
    var v2=parseInt(t.value,10); if(isNaN(v2))return;
    S.league[t.dataset.lg]=v2; commit("League settings updated"); return; }
});
/* One heartbeat for everything that goes stale on its own: the wall clock the
   season is measured against, the pick clock, and the countdown on screen. A
   page left open on a kitchen counter for three days has to still be right. */
setInterval(function(){
  var wasDone=DONE.length;
  NOW=Date.now();
  if(EVENTS.length && EVENTS.filter(function(e){return e.ts<NOW;}).length!==wasDone){
    DONE=EVENTS.filter(function(e){return e.ts<NOW;});
    UPCOMING=EVENTS.filter(function(e){return e.ts>=NOW;});
    render();
  }
  if(tickDraft()) return;                      /* commit() re-rendered already */
  var el=document.querySelector(".timer"); if(!el||TAB!=="draft") return;
  var n=S.picks.length;
  if(S.league.draftMode==="live"&&n<draftOrder().length)
    el.textContent=countdown(pickDeadline(n))+" left · "+S.league.pickHours+"h clock";
},30000);

loadState();
initFirebase();
tickDraft();
render();
})();
